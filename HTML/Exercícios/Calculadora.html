<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        main {
            background-color: rgb(41, 41, 41);
            border-radius: 10px;
        }
        
        nav {
            font-size: 2em;
            color: white;
            text-align: center;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        p.o {
            display: inline-block;
            height: 60px;
            width: 60px;
            background-color: rgb(51, 51, 51);
            text-align: center;
            border-radius: 5px;
        }

        p.igual {
            display: inline-block;
            height: 60px;
            width: 60px;
            background-color: rgb(6, 162, 209);
            text-align: center;
            border-radius: 5px;
            color: black;
        }

        p.n {
            display: inline-block;
            height: 60px;
            width: 60px;
            background-color: rgb(66, 66, 66);
            text-align: center;
            border-radius: 5px;
        }

    </style>
</head>
<body>
    <main>
        <nav>
            <p class="o">%</p> <p class="o">CE</p> <p class="o">C</p> <p class="o">⌫</p>
        </nav>
        <nav>
            <p class="o">¹/x</p> <p class="o">x²</p> <p class="o">√x</p> <p class="o">÷</p>
        </nav>
        <nav>
            <p class="n">7</p> <p class="n">8</p> <p class="n">9</p> <p class="o">x</p>
        </nav>
        <nav>
            <p class="n">4</p> <p class="n">5</p> <p class="n">6</p> <p class="o">-</p>
        </nav>
        <nav>
            <p class="n">1</p> <p class="n">2</p> <p class="n">3</p> <p class="o">+</p>
        </nav>
        <nav>
            <p class="n">+/-</p> <p class="n">0</p> <p class="n">,</p> <p class="igual">=</p>
        </nav>
    </main>
</body>
</html>
