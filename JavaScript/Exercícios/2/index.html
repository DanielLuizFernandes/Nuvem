<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botão mágico</title>
</head>
<body>
    <div>
        <h1>Clique no botão e veja o que acontece!</h1>
        <input type="button" value="Clique aqui" id="botao">
    </div>
    <script>
        let botao = document.querySelector("#botao");
        botao.addEventListener("click", function cor() {
            document.body.style.background = "blue";
        });
        
    </script>
</body>
</html>
